# ============================================
# NETWORKS
# ============================================
networks:
  inventory-network:
    driver: bridge

# ============================================
# VOLUMES (Persistent Storage)
# ============================================
volumes:
  redis-cluster-data-1:
  redis-cluster-data-2:
  redis-cluster-data-3:
  redis-cluster-data-4:
  redis-cluster-data-5:
  redis-cluster-data-6:
  kafka-data-1:
  kafka-data-2:
  kafka-data-3:
  zookeeper-data:
  redisinsight-data: 

# ============================================
# SERVICES
# ============================================
services:

  # ==========================================
  # REDIS CLUSTER NODES
  # ==========================================
  redis-master-1:
    image: redis:7-alpine
    container_name: redis-master-1
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes-7001.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis-cluster-data-1:/data
    networks:
      - inventory-network
    restart: unless-stopped

  redis-master-2:
    image: redis:7-alpine
    container_name: redis-master-2
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes-7002.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis-cluster-data-2:/data
    networks:
      - inventory-network
    restart: unless-stopped

  redis-master-3:
    image: redis:7-alpine
    container_name: redis-master-3
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes-7003.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis-cluster-data-3:/data
    networks:
      - inventory-network
    restart: unless-stopped

  redis-replica-1:
    image: redis:7-alpine
    container_name: redis-replica-1
    command: redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes-7004.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - redis-cluster-data-4:/data
    networks:
      - inventory-network
    restart: unless-stopped

  redis-replica-2:
    image: redis:7-alpine
    container_name: redis-replica-2
    command: redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes-7005.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - redis-cluster-data-5:/data
    networks:
      - inventory-network
    restart: unless-stopped

  redis-replica-3:
    image: redis:7-alpine
    container_name: redis-replica-3
    command: redis-server --port 7006 --cluster-enabled yes --cluster-config-file nodes-7006.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7006:7006"
      - "17006:17006"
    volumes:
      - redis-cluster-data-6:/data
    networks:
      - inventory-network
    restart: unless-stopped

  # ==========================================
  # REDISINSIGHT UI (Redis Management)
  # ==========================================
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/db
    networks:
      - inventory-network
    environment:
      - RI_SERVER_PORT=5540
      - RI_REDIS_CLUSTER_NODES=redis-master-1:7001,redis-master-2:7002,redis-master-3:7003
    restart: unless-stopped
    depends_on:
      - redis-master-1
      - redis-master-2
      - redis-master-3

  # ==========================================
  # ZOOKEEPER
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: inventory-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/data
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # KAFKA BROKERS
  # ==========================================
  kafka1:
    image: confluentinc/cp-kafka:7.3.0
    container_name: inventory-kafka-1
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SET_ACL: "false"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf -Dzookeeper.sasl.client=false"
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_najira="naji12";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data-1:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    networks:
      - inventory-network
    restart: unless-stopped

  kafka2:
    image: confluentinc/cp-kafka:7.3.0
    container_name: inventory-kafka-2
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SET_ACL: "false"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf -Dzookeeper.sasl.client=false" 
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_najira="naji12";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9093:9093"
    volumes:
      - kafka-data-2:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    networks:
      - inventory-network
    restart: unless-stopped

  kafka3:
    image: confluentinc/cp-kafka:7.3.0
    container_name: inventory-kafka-3
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_SET_ACL: "false"
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf -Dzookeeper.sasl.client=false" 
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29094,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_LISTENER_NAME_SASL_PLAINTEXT_PLAIN_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="admin-secret"
        user_admin="admin-secret"
        user_najira="naji12";
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 2
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka-data-3:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    networks:
      - inventory-network
    restart: unless-stopped

  # ==========================================
  # YOUR NODE.JS APPLICATION
  # ==========================================
  inventory-app:
    build: .
    container_name: inventory-app
    depends_on:
      kafka1:
        condition: service_started
    environment:
      REDIS_CLUSTER_NODES: "redis-master-1:7001,redis-master-2:7002,redis-master-3:7003"
      KAFKA_BROKERS: "kafka1:9092,kafka2:9093,kafka3:9094"
      KAFKA_USERNAME: najira
      KAFKA_PASSWORD: naji12
      ZOOKEEPER_HOST: zookeeper
      ZOOKEEPER_PORT: 2181
      NODE_ENV: production
    networks:
      - inventory-network
    restart: unless-stopped